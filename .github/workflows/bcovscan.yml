name: bcovscan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: tools/bcovscan/go.mod
      - name: Build bcovscan
        working-directory: tools/bcovscan
        run: go vet ./... && go build -o bcovscan .
      - name: Validate scenarios (script vs hand-checked expected coverage)
        run: python3 scripts/validate.py
      - name: Coverage report of the samples
        run: |
          tools/bcovscan/bcovscan scan --root . --src samples/src \
            --tests samples/tests/dunitx --tests samples/tests/dunit --out .bcov/samples
      - uses: actions/upload-artifact@v4
        with:
          name: bcov-report
          path: |
            .bcov/samples
            .bcov/validate
      - name: Random scale check (1000 methods, 10000 tests, independent oracle)
        run: |
          for seed in 7 99 1234; do
            python3 scripts/gen_scale.py .bcov/gen-$seed 50 20 10 $seed
            tools/bcovscan/bcovscan scan --root .bcov/gen-$seed --src src --tests tests --out .bcov/gen-$seed/out > /dev/null
            tools/bcovscan/bcovscan check --report .bcov/gen-$seed/out/coverage.json --expected .bcov/gen-$seed/expected.json
          done
